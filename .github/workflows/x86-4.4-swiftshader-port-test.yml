name: Build SwiftShader GLES2 for Android-x86 4.4

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Numero de jobs paralelos do make (-j)"
        required: false
        default: "1"
        type: string

      swiftshader_ref:
        description: "Commit do SwiftShader legado"
        required: false
        default: "40586720c2da48d4bb1ddf936204fd6eab2d54a9"
        type: string

jobs:
  build-swiftshader:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # ESPACO
      # ============================================================

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"

          sudo apt-get clean

          df -h /

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            unzip \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            lib32z1-dev \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            mtools \
            syslinux-utils \
            libssl-dev \
            fontconfig \
            python2 \
            python3 \
            openjdk-8-jdk

          echo "===== Python ====="

          python2 --version

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          python --version

          echo "===== Java ====="

          java -version

          echo "===== GCC ====="

          gcc --version

      # ============================================================
      # REPO
      # ============================================================

      - name: Instalar repo
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # GIT
      # ============================================================

      - name: Configurar git
        run: |
          set -eux

          git config --global user.email "ci@example.com"
          git config --global user.name "Android-x86 SwiftShader CI"
          git config --global color.ui false

          git config --global http.version HTTP/1.1

      # ============================================================
      # ANDROID-X86 4.4  (com fallback de host)
      # ============================================================

      - name: Inicializar Android-x86 4.4
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          rm -rf android-x86-src
          mkdir -p android-x86-src
          cd android-x86-src

          manifest_urls=(
            "https://scm.osdn.net/gitroot/android-x86/manifest"
            "https://github.com/android-x86-mirror/manifest"
            "http://scm.osdn.net/gitroot/android-x86/manifest"
          )

          success=0
          used_url=""

          for url in "${manifest_urls[@]}"; do
            echo "Tentando manifest: $url"

            if repo init -u "$url" -b android-x86-4.4-r5; then
              success=1
              used_url="$url"
              echo "OK com: $url"
              break
            fi

            echo "Falhou: $url"
            rm -rf .repo
          done

          if [ "$success" != "1" ]; then
            echo "Nenhum host de manifest funcionou."
            exit 1
          fi

          # Guarda qual host foi usado, para decidir se precisamos
          # remapear os projetos "x86" para os nomes flat do mirror
          # do GitHub (ver proximo step).
          echo "$used_url" > /tmp/manifest_url_used.txt
          cat /tmp/manifest_url_used.txt

      # ============================================================
      # REMAPEAR MANIFEST PARA O MIRROR DO GITHUB
      # ============================================================
      #
      # O manifest oficial (android-x86-4.4-r5) define o remote "x86"
      # com fetch="." (relativo a URL do manifest). Isso funciona
      # contra o OSDN, onde a estrutura de diretorios bate com o
      # atributo "name" dos projetos (ex: gitroot/android-x86/platform/bionic).
      #
      # O mirror do GitHub (android-x86-mirror) usa nomes de repo
      # "achatados": sem prefixo "platform/" e com "-" no lugar de "/"
      # (ex: platform/bionic -> bionic, platform/frameworks/base ->
      # frameworks-base, platform/vendor/intel/houdini ->
      # vendor-intel-houdini).
      #
      # Se caimos no fallback do GitHub, precisamos reescrever o
      # atributo "name" de cada <project remote="x86"> para o nome
      # achatado correspondente, preservando o "path" original
      # (diretorio de checkout local).

      - name: Remapear projetos x86 para o mirror do GitHub
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -eux

          used_url="$(cat /tmp/manifest_url_used.txt)"

          if [[ "$used_url" != *github.com* ]]; then
            echo "Manifest veio do OSDN, nenhum remapeamento necessario."
            exit 0
          fi

          echo "Manifest veio do GitHub mirror, remapeando projetos x86..."

          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET

          path = ".repo/manifests/default.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          changed = 0
          for project in root.findall("project"):
              if project.get("remote") != "x86":
                  continue

              local_path = project.get("path") or project.get("name")
              flat_name = local_path.replace("/", "-")

              if project.get("path") is None:
                  project.set("path", local_path)

              project.set("name", flat_name)
              changed += 1

          tree.write(path, xml_declaration=True, encoding="UTF-8")
          print(f"Projetos remapeados: {changed}")
          PYEOF

          echo "===== Diff de amostra (projetos x86) ====="

          grep 'remote="x86"' .repo/manifests/default.xml | head -20

      # ============================================================
      # SYNC
      # ============================================================

      - name: Sincronizar Android-x86
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -o pipefail

          success=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "=========================================="
            echo "REPO SYNC - TENTATIVA $i"
            echo "=========================================="

            if repo sync \
              -c \
              -j1 \
              --no-tags \
              --no-clone-bundle \
              --force-sync \
              2>&1 | tee "/tmp/repo-sync-$i.log"; then

              success=1
              break
            fi

            echo "repo sync falhou."

            sleep 15

          done

          if [ "$success" != "1" ]; then
            echo "repo sync falhou definitivamente."
            exit 1
          fi

          repo manifest -r > /tmp/repo-manifest.xml

      # ============================================================
      # MOSTRAR TOOLCHAIN DO KITKAT
      # ============================================================

      - name: Diagnosticar toolchain
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          echo "===== BUILD ====="

          ls -la build 2>/dev/null || true

          echo "===== PREBUILTS ====="

          find prebuilt -maxdepth 3 -type d 2>/dev/null \
            | head -100 || true

          echo "===== GCC ====="

          gcc --version

          echo "===== PYTHON ====="

          python --version

      # ============================================================
      # SWIFTSHADER
      # ============================================================

      - name: Baixar SwiftShader legado
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -eux

          rm -rf external/swiftshader

          mkdir -p external

          git clone \
            https://android.googlesource.com/platform/external/swiftshader \
            external/swiftshader

          cd external/swiftshader

          echo "===== REMOTE ====="

          git remote -v

          echo "===== COMMIT SOLICITADO ====="

          git checkout \
            "${{ github.event.inputs.swiftshader_ref }}"

          echo "===== COMMIT ATUAL ====="

          git log -1 --oneline

          echo "===== ARQUIVOS ====="

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "Android.mk" \
              -o -name "Application.mk" \
              -o -name "*GLESv1*" \
              -o -name "*GLESv2*" \
              -o -name "*libEGL*" \
            \) \
            -print \
            | head -300

      # ============================================================
      # DIAGNOSTICO SWIFTSHADER
      # ============================================================

      - name: Diagnosticar SwiftShader
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          mkdir -p /tmp/swiftshader

          find external/swiftshader \
            -type f \
            > /tmp/swiftshader/files.txt

          grep -Rni \
            "LOCAL_MODULE" \
            external/swiftshader \
            > /tmp/swiftshader/modules.txt \
            2>/dev/null || true

          grep -Rni \
            "LOCAL_CLANG\|clang\|libc++\|stlport\|-std=c++11\|-std=c++14" \
            external/swiftshader \
            > /tmp/swiftshader/toolchain.txt \
            2>/dev/null || true

          echo "===== MODULES ====="

          cat /tmp/swiftshader/modules.txt || true

          echo "===== TOOLCHAIN ====="

          cat /tmp/swiftshader/toolchain.txt || true

      # ============================================================
      # INICIALIZAR BUILD ANDROID
      # ============================================================

      - name: Inicializar ambiente Android
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -eux

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch android_x86-eng

      # ============================================================
      # COMPILAR SWIFTSHADER (GLES1 + GLES2)
      # ============================================================
      #
      # O fallback nativo do KitKat (PixelFlinger) so oferece GLES1
      # (OpenGL ES-CM 1.0). O foco do projeto e GLES2, mas compilamos
      # libGLESv1_CM_swiftshader "de tabela" tambem: o proprio libEGL.so
      # generico do AOSP consulta o egl.cfg e faz dlopen() por sufixo,
      # entao ter as tres libs presentes evita qualquer componente do
      # sistema que ainda espere um driver GLES1 valido durante o boot.

      - name: Compilar SwiftShader GLES1 + GLES2
        id: swiftshader_build
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -o pipefail

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch android_x86-eng

          echo ""
          echo "=========================================="
          echo "COMPILANDO SWIFTSHADER (GLES1_CM + GLES2 + EGL)"
          echo "=========================================="

          make \
            libEGL_swiftshader \
            libGLESv1_CM_swiftshader \
            libGLESv2_swiftshader \
            -j"${{ github.event.inputs.jobs }}" \
            2>&1 | tee /tmp/swiftshader-build.log

      # ============================================================
      # PROCURAR .SO
      # ============================================================

      - name: Verificar bibliotecas geradas
        if: always()
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          mkdir -p /tmp/swiftshader/output

          echo "===== libEGL ====="

          find out \
            -type f \
            -name "libEGL_swiftshader.so" \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/libEGL.txt || true

          echo "===== libGLESv1_CM ====="

          find out \
            -type f \
            -name "libGLESv1_CM_swiftshader.so" \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/libGLESv1_CM.txt || true

          echo "===== libGLESv2 ====="

          find out \
            -type f \
            -name "libGLESv2_swiftshader.so" \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/libGLESv2.txt || true

          echo "===== TODOS OS GLES ====="

          find out \
            -type f \
            \( \
              -name "*GLES*.so" \
              -o -name "*EGL*.so" \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/all.txt || true

      # ============================================================
      # GERAR egl.cfg
      # ============================================================
      #
      # Formato: <display_id> <numero_gpus> <sufixo>
      # Forcamos o sufixo "swiftshader" como unico driver, sem
      # tentar Mesa antes (evita concorrencia com GPU real).

      - name: Gerar egl.cfg
        if: always()
        run: |
          mkdir -p /tmp/swiftshader/output
          echo "0 1 swiftshader" > /tmp/swiftshader/output/egl.cfg
          cat /tmp/swiftshader/output/egl.cfg

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-kitkat-build
          path: |
            /tmp/swiftshader-build.log
            /tmp/swiftshader/**
            /tmp/repo-sync-*.log
            /tmp/repo-manifest.xml
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # RESULTADO
      # ============================================================

      - name: Resultado
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "RESULTADO SWIFTSHADER"
          echo "=========================================="

          if [ "${{ steps.swiftshader_build.outcome }}" = "success" ]; then

            echo ""
            echo "=========================================="
            echo "SWIFTSHADER COMPILOU"
            echo "=========================================="

            echo ""
            echo "As bibliotecas devem estar em out/."
            echo "Copie libEGL_swiftshader.so, libGLESv1_CM_swiftshader.so"
            echo "e libGLESv2_swiftshader.so para /system/lib/egl/ na imagem,"
            echo "junto com o egl.cfg gerado (no artifact)."

          else

            echo ""
            echo "=========================================="
            echo "SWIFTSHADER NAO COMPILOU"
            echo "=========================================="

            echo ""
            echo "Baixe o artifact:"
            echo ""
            echo "swiftshader-kitkat-build"
            echo ""
            echo "Principal:"
            echo ""
            echo "swiftshader-build.log"

          fi
