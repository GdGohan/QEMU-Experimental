name: Build SwiftShader GLES2 for Android-x86 4.4

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Numero de jobs paralelos do make (-j)"
        required: false
        default: "1"
        type: string

      swiftshader_ref:
        description: "Commit do SwiftShader legado"
        required: false
        default: "40586720c2da48d4bb1ddf936204fd6eab2d54a9"
        type: string

jobs:
  build-swiftshader:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # ESPACO
      # ============================================================

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"

          sudo apt-get clean

          df -h /

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            unzip \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            lib32z1-dev \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            mtools \
            syslinux-utils \
            libssl-dev \
            fontconfig \
            python2 \
            openjdk-8-jdk

          echo "===== Python ====="

          python2 --version

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          python --version

          echo "===== Java ====="

          java -version

          echo "===== GCC ====="

          gcc --version

      # ============================================================
      # REPO
      # ============================================================

      - name: Instalar repo
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # GIT
      # ============================================================

      - name: Configurar git
        run: |
          set -eux

          git config --global user.email "ci@example.com"
          git config --global user.name "Android-x86 SwiftShader CI"
          git config --global color.ui false

          git config --global http.version HTTP/1.1

      # ============================================================
      # TESTAR SOURCEFORGE
      # ============================================================

      - name: Testar servidor Android-x86
        run: |
          set -x

          echo "===== DNS ====="

          getent hosts git.code.sf.net || true
          getent hosts gitscm.sf.net || true

          echo "===== MANIFEST ====="

          git ls-remote \
            http://git.code.sf.net/p/android-x86/manifest \
            2>&1 || true

          echo "===== GITSCM ====="

          git ls-remote \
            http://gitscm.sf.net/gitroot/android-x86/manifest \
            2>&1 || true

      # ============================================================
      # ANDROID-X86 4.4
      # ============================================================

      - name: Inicializar Android-x86 4.4
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          rm -rf android-x86-src

          mkdir -p android-x86-src

          cd android-x86-src

          repo init \
            -u https://git.code.sf.net/p/android-x86/manifest \
            -b android-x86-4.4-r5

          repo manifest -r > /tmp/repo-manifest.xml

      # ============================================================
      # SYNC
      # ============================================================

      - name: Sincronizar Android-x86
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -o pipefail

          success=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "=========================================="
            echo "REPO SYNC - TENTATIVA $i"
            echo "=========================================="

            if repo sync \
              -c \
              -j1 \
              --no-tags \
              --no-clone-bundle \
              --force-sync \
              2>&1 | tee "/tmp/repo-sync-$i.log"; then

              success=1
              break
            fi

            echo "repo sync falhou."

            sleep 15

          done

          if [ "$success" != "1" ]; then
            echo "repo sync falhou definitivamente."
            exit 1
          fi

      # ============================================================
      # MOSTRAR TOOLCHAIN DO KITKAT
      # ============================================================

      - name: Diagnosticar toolchain
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          echo "===== BUILD ====="

          ls -la build 2>/dev/null || true

          echo "===== PREBUILTS ====="

          find prebuilt -maxdepth 3 -type d 2>/dev/null \
            | head -100 || true

          echo "===== GCC ====="

          gcc --version

          echo "===== PYTHON ====="

          python --version

      # ============================================================
      # SWIFTSHADER
      # ============================================================

      - name: Baixar SwiftShader legado
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -eux

          rm -rf external/swiftshader

          mkdir -p external

          git clone \
            https://android.googlesource.com/platform/external/swiftshader \
            external/swiftshader

          cd external/swiftshader

          echo "===== REMOTE ====="

          git remote -v

          echo "===== COMMIT SOLICITADO ====="

          git checkout \
            "${{ github.event.inputs.swiftshader_ref }}"

          echo "===== COMMIT ATUAL ====="

          git log -1 --oneline

          echo "===== ARQUIVOS ====="

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "Android.mk" \
              -o -name "Application.mk" \
              -o -name "*GLESv2*" \
              -o -name "*libEGL*" \
            \) \
            -print \
            | head -300

      # ============================================================
      # DIAGNOSTICO SWIFTSHADER
      # ============================================================

      - name: Diagnosticar SwiftShader
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          mkdir -p /tmp/swiftshader

          find external/swiftshader \
            -type f \
            > /tmp/swiftshader/files.txt

          grep -Rni \
            "LOCAL_MODULE" \
            external/swiftshader \
            > /tmp/swiftshader/modules.txt \
            2>/dev/null || true

          grep -Rni \
            "LOCAL_CLANG\|clang\|libc++\|stlport\|-std=c++11\|-std=c++14" \
            external/swiftshader \
            > /tmp/swiftshader/toolchain.txt \
            2>/dev/null || true

          echo "===== MODULES ====="

          cat /tmp/swiftshader/modules.txt || true

          echo "===== TOOLCHAIN ====="

          cat /tmp/swiftshader/toolchain.txt || true

      # ============================================================
      # INICIALIZAR BUILD ANDROID
      # ============================================================

      - name: Inicializar ambiente Android
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -eux

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch android_x86-eng

      # ============================================================
      # COMPILAR SOMENTE SWIFTSHADER
      # ============================================================

      - name: Compilar SwiftShader GLES2
        id: swiftshader_build
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -o pipefail

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch android_x86-eng

          echo ""
          echo "=========================================="
          echo "COMPILANDO SWIFTSHADER"
          echo "=========================================="

          make \
            libEGL_swiftshader \
            libGLESv2_swiftshader \
            -j"${{ github.event.inputs.jobs }}" \
            2>&1 | tee /tmp/swiftshader-build.log

      # ============================================================
      # PROCURAR .SO
      # ============================================================

      - name: Verificar bibliotecas geradas
        if: always()
        working-directory: ${{ github.workspace }}/android-x86-src
        run: |
          set -x

          mkdir -p /tmp/swiftshader/output

          echo "===== libEGL ====="

          find out \
            -type f \
            -name "libEGL_swiftshader.so" \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/libEGL.txt || true

          echo "===== libGLESv2 ====="

          find out \
            -type f \
            -name "libGLESv2_swiftshader.so" \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/libGLESv2.txt || true

          echo "===== TODOS OS GLES ====="

          find out \
            -type f \
            \( \
              -name "*GLES*.so" \
              -o -name "*EGL*.so" \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null \
            | tee /tmp/swiftshader/output/all.txt || true

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-kitkat-build
          path: |
            /tmp/swiftshader-build.log
            /tmp/swiftshader/**
            /tmp/repo-sync-*.log
            /tmp/repo-manifest.xml
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # RESULTADO
      # ============================================================

      - name: Resultado
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "RESULTADO SWIFTSHADER"
          echo "=========================================="

          if [ "${{ steps.swiftshader_build.outcome }}" = "success" ]; then

            echo ""
            echo "=========================================="
            echo "SWIFTSHADER COMPILOU"
            echo "=========================================="

            echo ""
            echo "As bibliotecas devem estar em out/."

          else

            echo ""
            echo "=========================================="
            echo "SWIFTSHADER NAO COMPILOU"
            echo "=========================================="

            echo ""
            echo "Baixe o artifact:"
            echo ""
            echo "swiftshader-kitkat-build"
            echo ""
            echo "Principal:"
            echo ""
            echo "swiftshader-build.log"

          fi
