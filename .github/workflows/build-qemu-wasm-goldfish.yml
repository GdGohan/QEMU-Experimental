name: build-qemu-goldfish

# Porta a placa "goldfish" (Android Emulator) para varias versoes do QEMU
# ao mesmo tempo, num unico workflow:
#
#   QEMU 2.9.1  -> Android 2.3.6 (Gingerbread) .. 4.0.x  (kernel goldfish 2.6.29, ARMv5/arm926)
#   QEMU 3.1.1  -> Android 4.0 .. 4.4          (kernel goldfish 3.4, ARMv7/cortex-a8)
#   QEMU 4.2.1  -> idem, primeira era com Kconfig
#   QEMU 5.1.0  -> ultima era com Makefile.objs (meson em hw/ so chega na 5.2)
#   qemu-wasm   -> QEMU moderno (~9.x) com backend TCG para WebAssembly, era meson
#
# As tres eras de build system sao detectadas em tempo de execucao pelo
# script ci/goldfish-integrate.sh gerado abaixo:
#
#   era A (2.9 .. 4.0): hw/*/Makefile.objs  + default-configs/arm-softmmu.mak
#   era B (4.1 .. 5.1): hw/*/Makefile.objs  + hw/*/Kconfig + configs/devices/...
#   era C (5.2 .. hoje): hw/*/meson.build   + hw/*/Kconfig + configs/devices/...
#
# Layout esperado neste repositorio:
#
#   goldfish-patches/
#     manifest.tsv                  # <arquivo-fonte> <destino-no-qemu> <CONFIG_SYMBOL|->
#     base/                         # fontes comuns a todas as versoes
#       hw_arm_goldfish.c ...
#     qemu-2.9/                     # overlays por era (sobrescrevem base/)
#       hw_arm_goldfish.c
#       diffs/*.patch
#     qemu-3.1/  qemu-4.2/  qemu-5.1/  qemu-modern/
#
# Se manifest.tsv nao existir, o workflow gera um manifest padrao com os
# 5 arquivos originais (goldfish.c, goldfish_pdev_bus.c, goldfish_timer.c
# e os 2 headers). Se base/ nao existir, os arquivos sao lidos direto de
# goldfish-patches/ (compatibilidade com o layout antigo).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Rodar apenas um alvo (ex: 2.9.1, 5.1.0, wasm). Vazio = todos."
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - "goldfish-patches/**"
      - ".github/workflows/build-qemu-goldfish.yml"

jobs:
  build:
    name: "QEMU ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- era A: sem Kconfig, sem meson, configure com python2 ----------
          - name: "2.9.1"
            repo: "https://github.com/qemu/qemu.git"
            ref: "v2.9.1"
            overlay: "qemu-2.9"
            mode: "native"
            image: "debian:stretch"
            python: "python2.7"
            android: "2.3.6 - 4.0 (goldfish 2.6.29, arm926)"
            cpu: "arm926"
            # ATENCAO: cada versao aceita um conjunto diferente de flags.
            # --disable-capstone so existe a partir da 3.0 e --disable-libssh2
            # virou --disable-libssh na 4.0. O build-native.sh descarta
            # sozinho o que o configure daquela arvore nao conhece, mas manter
            # a lista certa por era evita surpresa.
            configure_extra: >-
              --disable-sdl --disable-gtk --disable-vnc --disable-curses
              --disable-spice --disable-libssh2 --disable-vhost-net
              --disable-tpm --disable-guest-agent --disable-glusterfs
              --disable-brlapi --disable-libusb --disable-usb-redir
              --disable-smartcard --disable-libiscsi --disable-libnfs
              --disable-seccomp --disable-numa --disable-vde
              --disable-tools --disable-docs --audio-drv-list=
          - name: "3.1.1"
            repo: "https://github.com/qemu/qemu.git"
            ref: "v3.1.1"
            overlay: "qemu-3.1"
            mode: "native"
            image: "debian:stretch"
            python: "python2.7"
            android: "4.0 - 4.4 (goldfish 3.4, cortex-a8)"
            cpu: "cortex-a8"
            configure_extra: >-
              --disable-sdl --disable-gtk --disable-vnc --disable-curses
              --disable-spice --disable-capstone --disable-libssh2
              --disable-vhost-net --disable-tpm --disable-guest-agent
              --disable-glusterfs --disable-brlapi --disable-libusb
              --disable-usb-redir --disable-smartcard --disable-libiscsi
              --disable-libnfs --disable-seccomp --disable-numa --disable-vde
              --disable-tools --disable-docs --audio-drv-list=
          # ---------- era B: Kconfig + Makefile.objs, configure com python3 ----------
          - name: "4.2.1"
            repo: "https://github.com/qemu/qemu.git"
            ref: "v4.2.1"
            overlay: "qemu-4.2"
            mode: "native"
            image: "debian:buster"
            python: "python3"
            android: "4.0 - 4.4 (goldfish 3.4, cortex-a8)"
            cpu: "cortex-a8"
            # --without-default-features NAO existe aqui: entrou na 6.0.
            # Na 4.x/5.x o jeito e desligar cada coisa na mao.
            configure_extra: >-
              --disable-sdl --disable-gtk --disable-vnc --disable-curses
              --disable-spice --disable-capstone --disable-libssh
              --disable-vhost-net --disable-tpm --disable-guest-agent
              --disable-glusterfs --disable-brlapi --disable-libusb
              --disable-usb-redir --disable-smartcard --disable-libiscsi
              --disable-libnfs --disable-seccomp --disable-numa --disable-vde
              --disable-tools --disable-docs --audio-drv-list=
          - name: "5.1.0"
            repo: "https://github.com/qemu/qemu.git"
            ref: "v5.1.0"
            overlay: "qemu-5.1"
            mode: "native"
            image: "debian:buster"
            python: "python3"
            android: "4.0 - 4.4 (goldfish 3.4, cortex-a8)"
            cpu: "cortex-a8"
            configure_extra: >-
              --disable-sdl --disable-gtk --disable-vnc --disable-curses
              --disable-spice --disable-capstone --disable-libssh
              --disable-vhost-net --disable-tpm --disable-guest-agent
              --disable-glusterfs --disable-brlapi --disable-libusb
              --disable-usb-redir --disable-smartcard --disable-libiscsi
              --disable-libnfs --disable-seccomp --disable-numa --disable-vde
              --disable-tools --disable-docs --audio-drv-list=
          # ---------- era C: meson + Kconfig, alvo WebAssembly ----------
          - name: "wasm"
            repo: "https://github.com/ktock/qemu-wasm.git"
            ref: ""
            overlay: "qemu-modern"
            mode: "wasm"
            image: ""
            python: "python3"
            android: "2.3.6 - 4.4 (via wasm, ARMv5/ARMv7)"
            cpu: "arm926"
            configure_extra: >-
              --static --cpu=wasm32 --cross-prefix= --without-default-features
              --enable-system --with-coroutine=fiber --disable-tools --disable-docs

    steps:
      - name: Checkout deste repositorio
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Clonar o QEMU alvo
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          set -eu
          if [ -n "${{ matrix.ref }}" ]; then
            git clone --depth 1 --branch "${{ matrix.ref }}" "${{ matrix.repo }}" qemu
          else
            git clone --depth 1 "${{ matrix.repo }}" qemu
          fi
          cd qemu
          git submodule update --init --depth 1 || true
          echo "--- versao ---"; cat VERSION 2>/dev/null || true

      # Gera os scripts de integracao. Tudo dentro de heredocs com corpo
      # indentado no mesmo nivel do bloco (o YAML remove a indentacao comum,
      # entao o shell recebe o script alinhado na coluna 0). Nenhuma linha
      # abaixo da indentacao base -- caso contrario o bloco literal fecharia
      # antes da hora e o resto viraria YAML solto.
      - name: Gerar scripts de integracao
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          set -eu
          mkdir -p ci
          cat > ci/goldfish-integrate.sh <<'INTEGRATE'
          #!/bin/sh
          # uso: goldfish-integrate.sh <dir-do-qemu> <dir-goldfish-patches> <overlay>
          set -eu
          QEMU="$1"; PATCHDIR="$2"; OVERLAY="${3:-}"

          MANIFEST="$PATCHDIR/manifest.tsv"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: $MANIFEST nao existe." >&2
            echo "      O manifest e a fonte da verdade de quais arquivos" >&2
            echo "      entram na arvore e com qual simbolo CONFIG_. Sem ele" >&2
            echo "      o build passaria compilando nada -- falhar aqui e" >&2
            echo "      melhor que um binario sem a placa goldfish." >&2
            exit 1
          fi

          # ---- 1. copia dos fontes: overlay tem prioridade sobre base/ ----
          # ordem de busca: <overlay>/  ->  base/  ->  raiz (layout antigo)
          find_src() {
            f="$1"
            for d in \
              ${OVERLAY:+"$PATCHDIR/$OVERLAY"} \
              "$PATCHDIR/base" \
              "$PATCHDIR"
            do
              [ -f "$d/$f" ] && { printf '%s\n' "$d/$f"; return 0; }
            done
            return 1
          }

          # O simbolo prefixado com @ e o agregador da placa (recebe os
          # selects dos demais). Default se ninguem marcar: CONFIG_GOLDFISH.
          SYMBOLS=""
          BOARD_SYM=""
          while IFS="$(printf '\t')" read -r src dst sym; do
            case "$src" in ""|\#*) continue ;; esac
            found="$(find_src "$src")" || { echo "ERRO: fonte nao encontrado: $src" >&2; exit 1; }
            mkdir -p "$QEMU/$(dirname "$dst")"
            cp -v "$found" "$QEMU/$dst"
            case "$sym" in
              ""|-) ;;
              @*)
                sym="${sym#@}"
                BOARD_SYM="$sym"
                SYMBOLS="$SYMBOLS $sym:$dst"
                ;;
              *) SYMBOLS="$SYMBOLS $sym:$dst" ;;
            esac
          done < "$MANIFEST"
          [ -n "$BOARD_SYM" ] || BOARD_SYM="CONFIG_GOLDFISH"
          BOARD_SHORT="$(printf '%s' "$BOARD_SYM" | sed 's/^CONFIG_//')"
          echo "simbolo agregador da placa: $BOARD_SYM"

          # simbolos de terceiros que a placa precisa (ex: SMC91C111)
          EXTRA_SELECTS=""
          if [ -f "$PATCHDIR/extra-selects.txt" ]; then
            EXTRA_SELECTS="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' \
                             "$PATCHDIR/extra-selects.txt" | tr -d ' \t')"
          fi

          # ---- 2. deteccao da era do build system ----
          cd "$QEMU"

          # Versao real da arvore, lida do arquivo VERSION (existe em todas
          # as versoes e tambem nos forks: o qemu-wasm do ktock diz 8.2.0).
          # A camada de compatibilidade se recusa a compilar sem isto, de
          # proposito -- adivinhar versao gera bug silencioso.
          if [ ! -f VERSION ]; then
            echo "ERRO: $QEMU/VERSION nao existe -- nao da para saber a versao" >&2
            echo "      do QEMU. Passe GF_FORCE_VERSION=x.y no ambiente." >&2
            [ -n "${GF_FORCE_VERSION:-}" ] || exit 1
          fi
          GF_VER="${GF_FORCE_VERSION:-$(tr -d ' \n' < VERSION)}"
          GF_VMAJ="$(printf '%s' "$GF_VER" | cut -d. -f1)"
          GF_VMIN="$(printf '%s' "$GF_VER" | cut -d. -f2)"
          echo "versao da arvore QEMU: $GF_VER (major=$GF_VMAJ minor=$GF_VMIN)"
          mkdir -p include/hw/goldfish
          {
            echo '/* gerado por ci/goldfish-integrate.sh -- nao editar */'
            echo '#ifndef HW_GOLDFISH_GF_VERSION_H'
            echo '#define HW_GOLDFISH_GF_VERSION_H'
            echo "#define GF_VER_MAJOR $GF_VMAJ"
            echo "#define GF_VER_MINOR $GF_VMIN"
            echo '#endif'
          } > include/hw/goldfish/gf-version.h
          if [ -f hw/arm/meson.build ]; then
            BUILDSYS="meson"
          elif [ -f hw/arm/Makefile.objs ]; then
            BUILDSYS="makefile"
          else
            echo "ERRO: nem hw/arm/meson.build nem hw/arm/Makefile.objs" >&2; exit 1
          fi
          if [ -f hw/arm/Kconfig ]; then HAVE_KCONFIG=yes; else HAVE_KCONFIG=no; fi
          DEFCONFIG=""
          for f in configs/devices/arm-softmmu/default.mak default-configs/arm-softmmu.mak; do
            if [ -f "$f" ]; then DEFCONFIG="$f"; break; fi
          done
          # nome do sourceset de dispositivos mudou (softmmu_ss -> system_ss) na 8.x
          SYSSS="system_ss"
          if [ "$BUILDSYS" = meson ] && ! grep -q "system_ss" hw/timer/meson.build 2>/dev/null; then
            SYSSS="softmmu_ss"
          fi
          echo "build system: $BUILDSYS | Kconfig: $HAVE_KCONFIG | defconfig: ${DEFCONFIG:-nenhum} | sourceset: $SYSSS"

          # add_once: append idempotente por substring
          add_once() {
            file="$1"; marker="$2"; text="$3"
            mkdir -p "$(dirname "$file")"; touch "$file"
            grep -qF "$marker" "$file" 2>/dev/null || printf '%s\n' "$text" >> "$file"
          }
          # add_once_line: idem, mas o marcador precisa casar a LINHA INTEIRA.
          # Necessario para "config GOLDFISH", que por substring casaria com
          # "config GOLDFISH_PDEV_BUS" e faria o bloco agregador nunca ser escrito.
          add_once_line() {
            file="$1"; marker="$2"; text="$3"
            mkdir -p "$(dirname "$file")"; touch "$file"
            grep -qxF "$marker" "$file" 2>/dev/null || printf '%s\n' "$text" >> "$file"
          }

          # ---- 3. registro de cada objeto + Kconfig + defconfig ----
          SELECTS=""
          for entry in $SYMBOLS; do
            sym="${entry%%:*}"; dst="${entry#*:}"
            base="$(basename "$dst")"; dir="$(dirname "$dst")"
            obj="$(printf '%s' "$base" | sed 's/\.c$/.o/')"
            short="$(printf '%s' "$sym" | sed 's/^CONFIG_//')"
            [ "$sym" = "$BOARD_SYM" ] || SELECTS="$SELECTS $short"

            if [ "$BUILDSYS" = meson ]; then
              if [ "$dir" = hw/arm ]; then
                add_once "$dir/meson.build" "$base" \
                  "arm_ss.add(when: '$sym', if_true: files('$base'))"
              else
                add_once "$dir/meson.build" "$base" \
                  "$SYSSS.add(when: '$sym', if_true: files('$base'))"
              fi
            else
              if [ "$dir" = hw/arm ]; then
                add_once "$dir/Makefile.objs" "$obj" "obj-\$($sym) += $obj"
              else
                add_once "$dir/Makefile.objs" "$obj" "common-obj-\$($sym) += $obj"
              fi
            fi

            if [ "$HAVE_KCONFIG" = yes ] && [ "$sym" != "$BOARD_SYM" ]; then
              add_once_line "$dir/Kconfig" "config $short" "$(printf 'config %s\n    bool' "$short")"
            fi

            # sem Kconfig (2.9 / 3.1) o gating vem todo do defconfig
            if [ "$HAVE_KCONFIG" = no ] && [ -n "$DEFCONFIG" ]; then
              add_once_line "$DEFCONFIG" "$sym=y" "$sym=y"
            fi
          done

          # placa agregadora: um unico CONFIG_GOLDFISH que puxa o resto.
          # Montado com printf '\n' explicito (nunca com string literal de
          # varias linhas) para nao gerar linha com indentacao menor que a
          # do bloco YAML, o que fecharia o literal antes da hora.
          if [ "$HAVE_KCONFIG" = yes ]; then
            block="$(printf 'config %s\n    bool' "$BOARD_SHORT")"
            for s in $SELECTS $EXTRA_SELECTS; do
              block="$(printf '%s\n    select %s' "$block" "$s")"
            done
            add_once_line hw/arm/Kconfig "config $BOARD_SHORT" "$block"
          elif [ -n "$DEFCONFIG" ]; then
            # sem Kconfig os simbolos de terceiros vao direto no defconfig
            for s in $EXTRA_SELECTS; do
              add_once_line "$DEFCONFIG" "CONFIG_$s=y" "CONFIG_$s=y"
            done
          fi
          # atencao: "[ cond ] && cmd" como ultimo comando derruba o script
          # inteiro sob set -e quando a condicao e falsa -- usar if/fi
          if [ -n "$DEFCONFIG" ]; then
            add_once_line "$DEFCONFIG" "$BOARD_SYM=y" "$BOARD_SYM=y"
          fi

          echo "--- Kconfig/defconfig resultante ---"
          grep -n "GOLDFISH" hw/arm/Kconfig ${DEFCONFIG:+"$DEFCONFIG"} 2>/dev/null || true

          # ---- 4. patches adicionais do overlay (ajustes finos por versao) ----
          for d in ${OVERLAY:+"../patches/goldfish-patches/$OVERLAY/diffs"} "../patches/goldfish-patches/diffs"; do
            [ -d "$d" ] || continue
            for p in "$d"/*.patch; do
              [ -e "$p" ] || continue
              echo "Aplicando $p"
              git apply --3way "$p" || { echo "ERRO ao aplicar $p" >&2; exit 1; }
            done
          done

          echo "integracao goldfish concluida"
          INTEGRATE
          chmod +x ci/goldfish-integrate.sh

          # Script de build nativo, executado DENTRO do container da era certa.
          # Debian stretch/buster ja sairam dos mirrors normais -> aponta o apt
          # para archive.debian.org e desliga a checagem de Valid-Until.
          cat > ci/build-native.sh <<'NATIVE'
          #!/bin/sh
          set -eu
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-$(printf '%s' "${VERSION:-}" | sed -n 's/.*(\(.*\)).*/\1/p')}"
          case "$CODENAME" in
            jessie|stretch|buster)
              printf 'deb http://archive.debian.org/debian %s main\n' "$CODENAME" > /etc/apt/sources.list
              printf 'deb http://archive.debian.org/debian-security %s/updates main\n' "$CODENAME" >> /etc/apt/sources.list
              printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid
              ;;
          esac
          apt-get update
          PKGS="build-essential git pkg-config libglib2.0-dev libpixman-1-dev
                zlib1g-dev libfdt-dev flex bison ca-certificates python3"
          case "$GF_PYTHON" in python2*) PKGS="$PKGS python2.7" ;; esac
          # shellcheck disable=SC2086
          apt-get install -y --no-install-recommends $PKGS

          cd /qemu
          PYBIN="$(command -v "$GF_PYTHON" || command -v python3)"

          # As opcoes do configure mudam muito entre 2.9 e 5.1: algumas nem
          # existiam, outras foram renomeadas (--disable-libssh2 virou
          # --disable-libssh na 4.0). Uma flag desconhecida NAO e ignorada
          # pelo QEMU -- ele aborta com "unknown option". Entao conferimos
          # cada uma contra o proprio script configure e descartamos as que
          # essa arvore nao conhece, avisando na log.
          CFG_OK=""
          for f in $GF_CONFIGURE_EXTRA; do
            fname="${f%%=*}"
            if grep -q -- "$fname" configure; then
              CFG_OK="$CFG_OK $f"
            else
              echo "AVISO: $f nao existe no configure desta versao -- ignorando"
            fi
          done
          echo "--- flags aceitas: $CFG_OK"

          # shellcheck disable=SC2086
          ./configure \
            --target-list=arm-softmmu \
            --python="$PYBIN" \
            --disable-werror \
            --extra-cflags="-Wno-error -fcommon" \
            $CFG_OK
          make -j"$(nproc)"

          BIN="$(find . -name 'qemu-system-arm' -type f -perm -u+x | head -n1)"
          echo "binario: $BIN"
          echo "--- maquinas com goldfish ---"
          "$BIN" -M help | grep -i goldfish || {
            echo "AVISO: a maquina goldfish nao apareceu em -M help" >&2; exit 1; }
          echo "--- dispositivos goldfish ---"
          "$BIN" -device help 2>&1 | grep -i goldfish || true
          mkdir -p /qemu/artifacts
          cp "$BIN" /qemu/artifacts/
          NATIVE
          chmod +x ci/build-native.sh

      # Verificacao rapida antes de gastar ~20 min compilando o QEMU: passa
      # cada .c pelo parser do C com headers-stub, para a versao ALVO desta
      # linha da matriz. Pega erro de digitacao e uso de API que nao existe
      # naquela era em segundos, nao no fim do build.
      - name: Checar sintaxe dos fontes goldfish
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          if [ -x patches/tools/check-syntax.sh ]; then
            sh patches/tools/check-syntax.sh
          else
            echo "tools/check-syntax.sh ausente -- pulando"
          fi

      - name: Integrar a placa goldfish na arvore do QEMU
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: ci/goldfish-integrate.sh qemu patches/goldfish-patches "${{ matrix.overlay }}"

      # ---------------- caminho nativo (2.9.1 .. 5.1.0) ----------------
      - name: Build nativo no container da era correta
        if: ${{ matrix.mode == 'native' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/qemu:/qemu" \
            -v "${{ github.workspace }}/ci:/ci:ro" \
            -e GF_PYTHON="${{ matrix.python }}" \
            -e GF_CONFIGURE_EXTRA="${{ matrix.configure_extra }}" \
            "${{ matrix.image }}" \
            /bin/sh -c "/ci/build-native.sh"

      # Boot test opcional: se o repo tiver tests/android/<algo>/{zImage,ramdisk.img},
      # tenta subir o kernel goldfish de verdade. Nunca derruba o workflow.
      - name: Smoke test de boot (opcional)
        if: ${{ matrix.mode == 'native' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        continue-on-error: true
        run: |
          set -eu
          KDIR="$(find patches/tests/android -name zImage -printf '%h\n' 2>/dev/null | head -n1 || true)"
          if [ -z "$KDIR" ]; then echo "sem kernel de teste em tests/android/ -- pulando"; exit 0; fi
          docker run --rm \
            -v "${{ github.workspace }}/qemu:/qemu" \
            -v "${{ github.workspace }}/$KDIR:/k:ro" \
            "${{ matrix.image }}" \
            /bin/sh -c '
              cd /qemu &&
              timeout 120 ./artifacts/qemu-system-arm \
                -M goldfish -cpu ${{ matrix.cpu }} -m 256 \
                -kernel /k/zImage \
                $([ -f /k/ramdisk.img ] && echo "-initrd /k/ramdisk.img") \
                -append "console=ttyS0 androidboot.hardware=goldfish qemu=1" \
                -nographic -no-reboot 2>&1 | tail -n 200
            '

      # ---------------- caminho WebAssembly (QEMU moderno) ----------------
      # O Dockerfile do qemu-wasm fixa ZLIB_VERSION=1.3.1 e baixa de
      # zlib.net/zlib-<v>.tar.xz. O zlib.net mantem so a ultima versao nesse
      # caminho direto e move as antigas para /fossils/ (onde existe apenas
      # .tar.gz) -- por isso o "tar xJ" quebrava com "File format not
      # recognized". Trocamos host, extensao e flag do tar de uma vez.
      - name: Corrigir URL do zlib no Dockerfile do qemu-wasm
        if: ${{ matrix.mode == 'wasm' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: |
          set -eu
          sed -i -E \
            -e 's#https://zlib\.net/zlib-\$\{?ZLIB_VERSION\}?\.tar\.xz#https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz#' \
            -e 's#(curl[^|]*zlib[^|]*\|\s*tar\s+)xJC#\1xzC#' \
            qemu/Dockerfile
          grep -n "zlib.net\|tar x" qemu/Dockerfile || true

      - name: Build da imagem de toolchain (emsdk + libs)
        if: ${{ matrix.mode == 'wasm' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: docker build -t buildqemu -f qemu/Dockerfile qemu

      - name: Compilar QEMU (goldfish) para WebAssembly
        if: ${{ matrix.mode == 'wasm' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/qemu:/qemu" \
            buildqemu \
            /bin/bash -lc '
              cd /qemu &&
              emconfigure ./configure \
                --target-list=arm-softmmu \
                ${{ matrix.configure_extra }} \
                --extra-cflags="-DNDEBUG -Wno-error=unused-command-line-argument" \
                --extra-cxxflags="-Wno-error=unused-command-line-argument" &&
              emmake make -j$(nproc)
            '

      # ---------------- artefatos ----------------
      - name: Registrar o diff aplicado na arvore do QEMU
        if: ${{ always() && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: |
          set -eu
          cd qemu && git add -A && git diff --cached > ../goldfish-${{ matrix.name }}.diff || true
          wc -l ../goldfish-${{ matrix.name }}.diff || true

      - name: Upload dos artefatos
        if: ${{ always() && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-goldfish-${{ matrix.name }}
          path: |
            goldfish-${{ matrix.name }}.diff
            qemu/artifacts/qemu-system-arm
            qemu/build/**/*.wasm
            qemu/build/**/*.js
          if-no-files-found: warn
